name: Report a bug
description: Tell us what went wrong in Omnia.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please keep passwords, provider keys and personal account details out of this report.
  - type: input
    id: version
    attributes:
      label: Omnia version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Fire TV / Android TV
        - Android
        - iOS
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include reproduction steps, expected behavior, actual behavior and device details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or redacted logs
      description: Remove private account information and configured provider URLs before attaching anything.
